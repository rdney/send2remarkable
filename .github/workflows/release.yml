name: Release

# Run from the Actions tab ("Run workflow"), or push a tag like v0.3.3.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: ver
        run: |
          V=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $V" >&2
            exit 1
          fi

      - name: Build
        run: ./build.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          gh release create "$TAG" dist/*.xpi \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
